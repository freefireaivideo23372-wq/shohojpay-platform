name: Build & Release ShohojPay.apk

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile ShohojPay.apk
        working-directory: android-app
        run: gradle assembleDebug

      - name: Rename APK to ShohojPay.apk
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk ShohojPay.apk

      - name: Publish ShohojPay.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ShohojPay Android App v1.0
          body: Official ShohojPay Auto SMS Payment Verification Android App (.apk)
          files: ShohojPay.apk
